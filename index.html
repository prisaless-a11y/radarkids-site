<style>/* RADAR KIDS — Color tokens
   Source: Brand Manual §04 Sistema Cromático / Strategy Doc §18
   "Energy without infantilization" — off-white + black structure; blue + orange lead; green/pink are sparing accents.
   Usage ratio target: ~60% off-white/paper, ~22% black, ~12% blue, ~6% orange (never as decorative fills). */

:root{
  /* ---- base palette (raw values) ---- */
  --rk-black:        #111111;
  --rk-graphite:      #1D1D1D;
  --rk-off-white:     #F7F5EF;
  --rk-paper:         #FBFAF6;
  --rk-white:         #FFFFFF;
  --rk-line:          #E3E0D6;
  --rk-muted:         #8C8A82;

  --rk-blue:          #0052FF;
  --rk-blue-deep:     #0040C8;
  --rk-orange:        #FF8A00;
  --rk-pink:          #FF6FAE;
  --rk-green:         #2E8B57;
  --rk-yellow:        #F2C200;

  /* ---- semantic aliases ---- */
  --surface-page:       var(--rk-paper);
  --surface-page-alt:   var(--rk-off-white);
  --surface-card:       var(--rk-white);
  --surface-inverse:    var(--rk-black);
  --surface-inverse-2:  var(--rk-graphite);

  --text-primary:       var(--rk-black);
  --text-inverse:       var(--rk-off-white);
  --text-muted:         var(--rk-muted);
  --text-on-accent:     var(--rk-white);

  --border-default:     var(--rk-line);
  --border-inverse:     rgba(255,255,255,.14);

  --accent-primary:     var(--rk-blue);     /* leads: CTAs, links, data */
  --accent-primary-deep:var(--rk-blue-deep);
  --accent-secondary:   var(--rk-orange);   /* energy accent, signature asterisk */
  --accent-tertiary:    var(--rk-pink);     /* culture / discovery accent */
  --accent-quaternary:  var(--rk-green);    /* growth / transform accent */
  --accent-quinary:     var(--rk-yellow);   /* founder-authority accent */

  --focus-ring:         var(--rk-blue);
  --selection-bg:       var(--rk-blue);
  --selection-fg:       var(--rk-white);

  /* pillar → color mapping (Observar·Conectar·Inspirar·Transformar) */
  --pillar-observar:    var(--rk-blue);
  --pillar-conectar:    var(--rk-orange);
  --pillar-inspirar:    var(--rk-pink);
  --pillar-transformar: var(--rk-green);
}

:root{
  --font-sans: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;

  /* single grotesque family carries the whole brand — weight does the differentiating */
  --font-weight-light:     300;
  --font-weight-regular:   400;
  --font-weight-medium:    500;
  --font-weight-semibold:  600;
  --font-weight-bold:      700;
  --font-weight-black:     800;

  /* type scale (desktop) */
  --text-display:   clamp(2.5rem, 6vw, 5.25rem);   /* 40–84px · H1 */
  --text-h1:         clamp(2.125rem, 5vw, 3.75rem);  /* 34–60px */
  --text-h2:         clamp(1.5rem, 3.2vw, 2.5rem);   /* 24–40px */
  --text-h3:         1.375rem;                        /* 22px */
  --text-body-lg:    1.3125rem;                       /* 21px · lead */
  --text-body:       1.0625rem;                       /* 17px */
  --text-small:      0.9375rem;                       /* 15px */
  --text-caption:    0.8125rem;                       /* 13px */
  --text-label:      0.6875rem;                       /* 11px · uppercase labels */

  --tracking-tight:   -.04em;   /* display */
  --tracking-snug:    -.02em;   /* headings */
  --tracking-normal:   0em;
  --tracking-wide:     .04em;   /* KIDS lockup lettering */
  --tracking-label:    .18em;   /* uppercase captions/eyebrows */
  --tracking-eyebrow:  .3em;    /* section numerals */

  --leading-tight:   0.9;
  --leading-snug:    1.0;
  --leading-normal:  1.5;
  --leading-relaxed: 1.65;
}

/* RADAR KIDS — Spacing, radius, border & shadow tokens
   Source: layout rhythm observed across both brand documents (100–140px section
   padding, 1px hairlines on off-white, mostly-square corners, deep soft shadows
   only on "applications" mockups — never on flat page content). */

:root{
  /* spacing scale */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-7:  28px;
  --space-8:  32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  --space-24: 96px;
  --space-30: 120px;

  --content-max-width: 1180px;
  --content-padding-x: 40px;

  /* radius — brand is almost square; radius is used sparingly, mainly on
     application mockups (cards, phones, browser chrome), never on the logo. */
  --radius-none: 0px;
  --radius-sm:   4px;
  --radius-md:   6px;
  --radius-lg:   8px;
  --radius-xl:   10px;
  --radius-pill: 999px;   /* CTA buttons, chips */
  --radius-full: 50%;     /* avatar / icon badges / dots */

  /* borders */
  --border-width-hairline: 1px;
  --border-width-thick:    2px;
  --border-color: var(--border-default);

  /* shadows — reserved for "application" mockups (cards floating on a page),
     never used on the flat site/report content itself */
  --shadow-sm:  0 4px 14px rgba(17,17,17,.08);
  --shadow-md:  0 18px 40px rgba(17,17,17,.12);
  --shadow-lg:  0 30px 60px rgba(17,17,17,.35);
  --shadow-xl:  0 40px 80px rgba(17,17,17,.4);
}

/* RADAR KIDS — Motion tokens
   Source: both documents use one consistent scroll-reveal pattern — fade + rise,
   never a bounce/spring. Editorial, confident, unhurried. */

:root{
  --ease-editorial: cubic-bezier(.16,1,.3,1); /* @kind other */  /* signature reveal ease */
  --ease-standard:  cubic-bezier(.4,0,.2,1); /* @kind other */

  --duration-fast:   150ms; /* @kind other */
  --duration-base:   300ms; /* @kind other */
  --duration-slow:   600ms; /* @kind other */
  --duration-reveal: 900ms; /* @kind other */  /* scroll-reveal fade+rise */

  --reveal-offset: 26px;      /* translateY starting offset for .rv-style reveals */
}

function ArrowIcon(){
  return <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>;
}

/* ---------- scroll reveal ---------- */
function useReveal() {
  const ref = React.useRef(null);
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { setVisible(true); obs.unobserve(e.target); } });
    }, { threshold: 0.15 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

function Reveal({ children, delay = 0, style = {} }) {
  const [ref, visible] = useReveal();
  return (
    <div ref={ref} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? 'none' : 'translateY(26px)',
      transition: `opacity 900ms cubic-bezier(.16,1,.3,1) ${delay}ms, transform 900ms cubic-bezier(.16,1,.3,1) ${delay}ms`,
      ...style,
    }}>
      {children}
    </div>
  );
}

/* ---------- kid-in-circle portrait ----------

   brand color already (see assets/photos/*-solid.png), so a plain
   object-fit:contain inside a same-color circular frame reads as one
   seamless filled circle with the child inscribed inside it. */
/* ---------- kid-in-circle portrait ----------
   Source photos are transparent-background cutouts pre-composited (offscreen)

function Pillars(){
  const items = [
    { n:'01', k:'var(--rk-blue)', t:'Observar', d:'Monitoramento contínuo de tendências, comportamentos e inovações no universo infantil.' },
    { n:'02', k:'var(--rk-orange)', t:'Conectar', d:'Integração de insights entre mercados, culturas e disciplinas.' },
    { n:'03', k:'var(--rk-pink)', t:'Inspirar', d:'Estímulo à criatividade com referências e análises validadas.' },
    { n:'04', k:'var(--rk-green)', t:'Transformar', d:'Conversão de inteligência em decisões de produto e estratégia.' },
  ];
  return (
    <section style={{ background:'var(--rk-black)', padding:'100px 0' }}>
      <div style={wrap}>
        <Reveal>
          <div style={{ display:'flex', alignItems:'center', gap:14, marginBottom:18 }}>
            <span style={{ width:30, height:2, background:'var(--rk-orange)', display:'inline-block' }} />
            <span style={{ fontSize:12, letterSpacing:'.24em', textTransform:'uppercase', color:'var(--rk-orange)', fontWeight:700 }}>Nosso método</span>
          </div>
          <h2 style={{ fontSize:'clamp(30px,4vw,44px)', fontWeight:800, letterSpacing:'-.02em', color:'var(--rk-off-white)', margin:'0 0 20px', lineHeight:1.1 }}>
            Quatro movimentos, um <span style={{ color:'var(--rk-orange)' }}>radar</span>.
          </h2>
          <p style={{ color:'rgba(255,255,255,.65)', fontSize:16, maxWidth:560, margin:'0 0 50px' }}>
            Toda pesquisa percorre esses quatro passos — do sinal captado à decisão tomada.
          </p>
        </Reveal>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:24 }}>
          {items.map((p,i) => (
            <Reveal key={p.n} delay={i*80}>
              <div style={{ background:'#1a1a1a', borderRadius:8, padding:'26px 24px', minHeight:180, display:'flex', flexDirection:'column', justifyContent:'flex-start' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                  <span style={{ fontSize:12, fontWeight:700, letterSpacing:'.1em', color:p.k }}>{p.n}</span>
                  <span style={{ fontSize:18, fontWeight:800, color:p.k, lineHeight:1 }}>*</span>
                </div>
                <div>
                  <h3 style={{ fontSize:20, fontWeight:800, color:'#fff', margin:'20px 0 10px', letterSpacing:'-.01em' }}>{p.t}</h3>
                  <p style={{ fontSize:13.5, color:'rgba(255,255,255,.6)', lineHeight:1.5, margin:0 }}>{p.d}</p>
                </div>
              </div>
            </Reveal>
          ))}
        </div>
      </div>
    </section>
  );
}

function Services(){
  const services = [
    { c:'var(--rk-blue)', t:'Pesquisa de Tendência', d:'O que vai movimentar o mercado — cores, materiais, silhuetas e comportamentos emergentes, com antecedência.' },
    { c:'var(--rk-orange)', t:'Pesquisa de Mercado', d:'Dados, oportunidades e movimentos do setor de calçados e acessórios infantis.' },
    { c:'var(--rk-pink)', t:'Comportamento do Consumidor', d:'Como pais, crianças e influenciadores decidem, desejam e consomem.' },
    { c:'var(--rk-green)', t:'Análise da Concorrência', d:'Estudo competitivo de marcas nacionais e internacionais.' },
  ];
  return (
    <section style={{ ...wrap, padding:'110px 48px' }}>

function Content(){
  const posts = [
    { bg:'var(--rk-blue)', t:'O futuro se constrói na infância' },
    { bg:'#fff', star:true },
    { bg:'var(--rk-black)', t:'Tendências para ir além' },
    { bg:'var(--rk-orange)', t:'Insights que geram direção' },
    { bg:'var(--rk-green)', t:'Observar · Conectar' },
    { bg:'var(--rk-pink)', t:'Cultura + infância' },
  ];
  return (
    <section style={{ ...wrap, padding:'110px 48px' }}>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:70, alignItems:'center' }}>
        <Reveal>
          <div style={{ display:'flex', alignItems:'center', gap:14, marginBottom:18 }}>
            <span style={{ width:30, height:2, background:'var(--rk-orange)', display:'inline-block' }} />
            <span style={{ fontSize:12, letterSpacing:'.24em', textTransform:'uppercase', color:'var(--rk-orange)', fontWeight:700 }}>No radar, todo dia</span>
          </div>
          <h2 style={{ fontSize:'clamp(28px,3.6vw,40px)', fontWeight:800, letterSpacing:'-.02em', lineHeight:1.15, margin:'0 0 24px' }}>
            <span style={{ color:'var(--rk-orange)' }}>Pílulas</span> de tendência no Instagram.
          </h2>
          <p style={{ fontSize:16, color:'#444', lineHeight:1.6, maxWidth:440, margin:'0 0 30px' }}>
            Enquanto a pesquisa profunda é sob demanda, o nosso perfil entrega leituras rápidas do que está se movendo na infância — a porta de entrada para conhecer o pensamento da RADAR <span style={{ color:'var(--rk-blue)' }}>K</span><span style={{ color:'var(--rk-orange)' }}>I</span><span style={{ color:'var(--rk-pink)' }}>D</span><span style={{ color:'var(--rk-green)' }}>S</span>.
          </p>
          <button type="button" onClick={() => window.open('https://www.instagram.com/radarkidsconsultoria/','_blank')} style={{ display:'inline-flex', alignItems:'center', gap:10, justifyContent:'center', fontFamily:'var(--font-sans)', fontWeight:600, letterSpacing:'-.01em', cursor:'pointer', borderRadius:'var(--radius-pill)', border:'none', background:'var(--rk-orange)', color:'#fff', padding:'14px 24px', fontSize:14 }}>Seguir no Instagram<ArrowIcon/></button>
        </Reveal>
        <Reveal delay={120}>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8 }}>
            {posts.map((p,i) => (
              <div key={i} style={{ aspectRatio:'1', borderRadius:6, background:p.bg, color:p.bg==='#fff' ? 'var(--rk-black)' : '#fff', display:'flex', alignItems:'center', justifyContent:'center', textAlign:'center', padding:12, fontSize:12.5, fontWeight:700, lineHeight:1.25 }}>
                {p.star ? <span style={{ fontSize:30, color:'var(--rk-orange)' }}>*</span> : p.t}
              </div>
            ))}
          </div>
        </Reveal>
      </div>
    </section>
  );
}

    <section style={{ background:'var(--rk-off-white)', padding:'110px 0 130px' }}>
      <div style={wrap}>

        <Reveal>
